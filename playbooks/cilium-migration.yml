---
# Rolling CNI migration: Flannel → Cilium
#
# Prerequisites (complete before running this playbook):
#   1. Cilium Helm chart deployed via ArgoCD (apps/cilium.yaml synced manually).
#      Cilium DaemonSet pods must be Running on all nodes before proceeding.
#      Verify: kubectl get pods -n kube-system -l k8s-app=cilium
#   2. CiliumLoadBalancerIPPool and CiliumL2AnnouncementPolicy applied:
#      kubectl apply -f manifests/cilium/
#   3. MetalLB still running — do not remove it until Phase 4 (post-migration).
#
# Flaw corrections from Staff Engineer review:
#   - k3s config changes applied per-node synchronously with the drain (not pre-applied
#     across all nodes), preventing premature flannel/kube-proxy teardown.
#   - Cilium's DaemonSet writes /etc/cni/net.d/05-cilium.conflist which takes
#     lexicographic precedence over 10-flannel.conflist — no manual CNI file deletion.
#   - bgpControlPlane disabled; L2 announcements used instead (no BGP router on LAN).
#
# Execution order: workers first, then control plane (set-hog).
#
# Dry-run first:
#   ansible-playbook playbooks/cilium-migration.yml --check
#
# Run against a single node to validate before rolling all workers:
#   ansible-playbook playbooks/cilium-migration.yml --limit fast-skunk
#
# Full migration:
#   ansible-playbook playbooks/cilium-migration.yml

- name: Migrate workers from Flannel to Cilium
  hosts: workers
  serial: 1
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify Cilium DaemonSet pod is Running on this node before draining
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get pod -n kube-system
          -l k8s-app=cilium
          --field-selector spec.nodeName={{ inventory_hostname }}
          -o jsonpath='{.items[0].status.phase}'
      register: cilium_phase
      failed_when: cilium_phase.stdout != "Running"
      changed_when: false

  tasks:
    - name: Cordon and drain node
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass drain {{ inventory_hostname }}
          --ignore-daemonsets
          --delete-emptydir-data
          --timeout=5m
      changed_when: true

    - name: Apply k3s agent config — disable flannel and kube-proxy
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        marker: "# {mark} CILIUM MIGRATION"
        block: |
          flannel-backend: "none"
          disable-network-policy: true
          disable-kube-proxy: true

    - name: Restart k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted

    - name: Wait for k3s-agent to settle
      ansible.builtin.wait_for:
        timeout: 30

    - name: Remove stale Flannel overlay interface (best-effort)
      ansible.builtin.command:
        cmd: ip link delete flannel.1
      register: del_flannel
      failed_when: del_flannel.rc != 0 and "Cannot find device" not in del_flannel.stderr
      changed_when: del_flannel.rc == 0

    - name: Wait for CiliumNode to report Ready
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get ciliumnode {{ inventory_hostname }}
          -o jsonpath='{.status.cilium.state}'
      register: cilium_state
      retries: 20
      delay: 10
      until: cilium_state.stdout == "Ready"
      changed_when: false

    - name: Uncordon node
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass uncordon {{ inventory_hostname }}
      changed_when: true

    - name: Pause 15 seconds before next node
      ansible.builtin.pause:
        seconds: 15


- name: Migrate control plane (set-hog) from Flannel to Cilium
  hosts: control_plane
  serial: 1
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify all workers are already on Cilium before touching control plane
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get nodes -l '!node-role.kubernetes.io/control-plane'
          -o jsonpath='{range .items[*]}{.metadata.name}={.spec.taints}{"\n"}{end}'
      register: worker_taint_check
      changed_when: false

    - name: Verify Cilium DaemonSet pod is Running on control plane
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get pod -n kube-system
          -l k8s-app=cilium
          --field-selector spec.nodeName={{ inventory_hostname }}
          -o jsonpath='{.items[0].status.phase}'
      register: cilium_phase_cp
      failed_when: cilium_phase_cp.stdout != "Running"
      changed_when: false

  tasks:
    - name: Cordon and drain control plane
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass drain {{ inventory_hostname }}
          --ignore-daemonsets
          --delete-emptydir-data
          --timeout=5m
      changed_when: true

    - name: Apply k3s server config — disable flannel and kube-proxy
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        marker: "# {mark} CILIUM MIGRATION"
        block: |
          flannel-backend: "none"
          disable-network-policy: true
          disable-kube-proxy: true

    - name: Restart k3s server (control plane)
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for k3s server to be ready (API server back up)
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass get nodes {{ inventory_hostname }}
      register: node_check
      retries: 30
      delay: 10
      until: node_check.rc == 0
      changed_when: false

    - name: Remove stale Flannel overlay interface on control plane (best-effort)
      ansible.builtin.command:
        cmd: ip link delete flannel.1
      register: del_flannel_cp
      failed_when: del_flannel_cp.rc != 0 and "Cannot find device" not in del_flannel_cp.stderr
      changed_when: del_flannel_cp.rc == 0

    - name: Wait for CiliumNode control plane to report Ready
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get ciliumnode {{ inventory_hostname }}
          -o jsonpath='{.status.cilium.state}'
      register: cilium_state_cp
      retries: 20
      delay: 10
      until: cilium_state_cp.stdout == "Ready"
      changed_when: false

    - name: Uncordon control plane
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass uncordon {{ inventory_hostname }}
      changed_when: true


- name: Phase 4 — Validate Cilium and remove MetalLB
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Verify all nodes are Ready and on Cilium
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass get ciliumnode -o wide
      changed_when: false

    - name: Verify LoadBalancer VIP is still reachable via Cilium L2 announcement
      ansible.builtin.command:
        cmd: >
          kubectl --context minicloud-break-glass get svc -A -o jsonpath=
          '{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name}
           IP={.status.loadBalancer.ingress[0].ip}{"\n"}{end}'
      changed_when: false
      register: lb_check

    - name: Print LoadBalancer IPs
      ansible.builtin.debug:
        var: lb_check.stdout_lines

    - name: Prompt operator to confirm VIP is reachable before removing MetalLB
      ansible.builtin.pause:
        prompt: |
          Confirm https://homer.10.0.0.200.nip.io (or any VIP service) is reachable.
          Press Enter to remove MetalLB, Ctrl-C to abort.

    - name: Remove MetalLB CRs (IPAddressPool + L2Advertisement)
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass delete -n metallb-system ipaddresspools,l2advertisements --all
      changed_when: true

    - name: Remove MetalLB controller and speaker deployments
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass delete -n metallb-system deployment --all
      changed_when: true

    - name: Remove MetalLB namespace
      ansible.builtin.command:
        cmd: kubectl --context minicloud-break-glass delete namespace metallb-system
      changed_when: true
      register: del_ns
      failed_when: del_ns.rc != 0 and "not found" not in del_ns.stderr

    - name: Migration complete — summary
      ansible.builtin.debug:
        msg: |
          Cilium migration complete.
          Next steps:
            1. Add hubble.10.0.0.200.nip.io to Homer dashboard (manifests/homer/01-configmap.yaml)
            2. Add cert-manager Certificate for hubble-ui-tls in kube-system
            3. Remove metallb-system from ArgoCD project namespace allowlist (00-project.yaml)
            4. Enable ArgoCD automated sync in apps/cilium.yaml now that migration is stable
            5. Write a CiliumNetworkPolicy to replace any existing NetworkPolicy resources
