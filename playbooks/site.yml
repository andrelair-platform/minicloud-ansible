---
- name: Bootstrap minicloud cluster nodes (post-MAAS, pre-k3s)
  hosts: cluster
  gather_facts: true
  roles:
    - common
    - longhorn-prereq
    - k3s-registries
    - network

- name: Control-plane customizations (k3s server node only)
  hosts: control_plane
  gather_facts: false
  roles:
    - coredns-ha
