---
- name: Install base utilities
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Kubernetes nodes run SWAPLESS — predictable OOM/scheduling semantics, and no
# swap-thrash latency/wear on old consumer SSDs. Ubuntu ships a /swap.img swapfile
# via fstab (+ a generated systemd unit); disable both so a re-provision stays off.
- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) > 0
  changed_when: true
  become: true

- name: Disable swap persistently (comment swap entries in /etc/fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1  # k8s node: swap disabled'
  become: true
  register: fstab_swap

- name: Reload systemd so the generated swap unit is dropped
  ansible.builtin.systemd:
    daemon_reload: true
  when: fstab_swap is changed
  become: true

# K8s node kernel sysctls. controller-runtime (Longhorn, chaos-mesh, many operators) opens one
# inotify instance per watch; the kernel default (128) is exhausted on a dense node, so a manager
# crashes at startup with `unable to start manager {"error": "too many open files"}`. This was set
# manually + inconsistently per node (drift — some at 512, star-kitten/swift-mac/loving-gannet left
# at 128; chaos-controller-manager crashlooped on star-kitten after a reboot repacked pods onto it,
# 2026-10-16). Codified here so every node is uniform + survives a re-provision.
- name: Write k8s node sysctls (/etc/sysctl.d/99-k8s.conf)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by minicloud-ansible (roles/common) — do not hand-edit.
      fs.inotify.max_user_instances=512
  become: true
  notify: Reload sysctl
