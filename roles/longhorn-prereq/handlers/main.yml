---
# Applying the blacklist alone doesn't drop maps multipathd already established, so flush
# them first (a map held by a live filesystem can't be flushed — harmless, hence failed_when
# false), then restart so multipathd reloads config and stops reclaiming Longhorn devices.
#
# NOTE: these are two handler TASKS sharing a `listen` topic — NOT a `block`. A block handler
# cannot be notified by name (ansible resolves `notify` to a handler task or a `listen` topic,
# not a block wrapper), which made `notify: Flush and restart multipathd` fail with "handler
# not found" and aborted site.yml. Same-topic handlers run in definition order (flush → restart).
- name: Flush existing multipath maps
  ansible.builtin.command: multipath -F
  register: multipath_flush
  changed_when: multipath_flush.rc == 0
  failed_when: false
  become: true
  listen: Flush and restart multipathd

- name: Restart multipathd
  ansible.builtin.systemd:
    name: multipathd
    state: restarted
  become: true
  listen: Flush and restart multipathd
