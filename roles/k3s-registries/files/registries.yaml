# /etc/rancher/k3s/registries.yaml — managed by Ansible.
#
# HARBOR RETIREMENT (minicloud-gitops/docs/harbor-retirement.md, 2026-11): the Harbor
# pull-through proxy-cache was REMOVED. The upstreams (docker.io / ghcr.io / quay.io /
# registry.k8s.io) are now pulled DIRECTLY by containerd (their default endpoints).
#
# Why this is the lynchpin: with Harbor as the ghcr.io mirror, PRIVATE ghcr packages
# 401'd (the proxy had no ghcr creds — it could only serve PUBLIC packages anonymously).
# Pulling ghcr.io directly lets each pod authenticate with its own `ghcr-pull`
# imagePullSecret → private packages work. The upstream endpoints were ALREADY the
# proven fallback (the old config kept them "so a Harbor restart doesn't break the
# cluster"), so this change just promotes the fallback to primary — low-risk + reversible.
#
# The `harbor.10.0.0.200.nip.io` entry + TLS are kept ONLY for the TRANSITION — the last
# `harbor.10.0.0.200.nip.io/library/*` pulls until every workload is flipped to ghcr and
# Harbor is decommissioned. After that, this whole file can be removed (containerd then
# pulls every registry directly by default).

mirrors:
  "harbor.10.0.0.200.nip.io":
    endpoint:
      - "https://harbor.10.0.0.200.nip.io"

configs:
  "harbor.10.0.0.200.nip.io":
    tls:
      ca_file: /etc/rancher/k3s/minicloud-ca.crt
