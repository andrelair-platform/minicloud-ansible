---
k3s_oidc_state: present
k3s_oidc_config_path: /etc/rancher/k3s/config.yaml
k3s_oidc_ca_file: /etc/rancher/k3s/minicloud-ca.crt
k3s_oidc_issuer_url: https://auth.10.0.0.200.nip.io/application/o/kubernetes/
